services:
  api:
    build: .
    # Entry point comes from the image CMD: sibyl.api.app:create_app
    ports:
      - "8000:8000"
    # Optional: .env is gitignored, and nothing in the app reads it yet, so a
    # fresh clone should still come up rather than failing on a missing file.
    env_file:
      - path: .env
        required: false
    depends_on:
      - redis
      - postgres

  # A `worker` service ran `celery -A src.api.tasks`, a module that has never
  # existed — it could only ever crash-loop. It comes back when src/sibyl/tasks/
  # has real tasks in it, pointing at sibyl.tasks.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: sibyl
      POSTGRES_PASSWORD: sibyl
      POSTGRES_DB: sibyl
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
