name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev,api,agents]"

      - name: Lint
        run: ruff check src/ tests/

      # tests/ rather than tests/unit/ — the integration suite is the only
      # end-to-end cover of run_full_diagnosis and was never being run.
      - name: Test
        run: pytest tests/ -v
