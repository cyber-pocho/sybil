[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sibyl"
version = "0.1.0"
description = "AI-powered forecasting and analytics service"
requires-python = ">=3.11"

# Core = what the diagnosis and forecasting layers actually import today.
# Everything else lives in an extra, so a plain `pip install sibyl` does not
# drag in torch or a database driver to profile a DataFrame.
#
# Upper bounds are deliberate. An unpinned `mapie` is how a removed class
# (MapieRegressor, gone in MAPIE 1.x) silently turned a wrapper into dead code
# that still imported cleanly. Ceilings make that failure loud at install time.
dependencies = [
    # Data / numerics
    "pandas>=2.1,<3.1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    # Forecasting
    "statsmodels>=0.14,<0.16",
    "prophet>=1.1,<2",
    # Schemas
    "pydantic>=2.0,<3",
    # Utilities
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# The HTTP service. Required by `make run-api` and the Docker image.
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
]

# The agent graph. Provider-neutral by construction: langgraph runs the loop,
# langchain-core defines the message and tool interfaces, and neither one knows
# which vendor is behind the model. Installing this gets you the agent without
# committing to a provider — pick one from the extras below.
#
# The ceilings say <2, not <1. The previous <1 pins predated LangChain's 1.0
# release and had quietly become the opposite of what a ceiling is for: instead
# of guarding against a breaking change, they excluded every current release and
# held the project on an end-of-life major. The suite passes unmodified on 1.x.
agents = [
    "langgraph>=1.0,<2",
    "langchain-core>=1.0,<2",
]

# Model providers. Install whichever one SIBYL_LLM_PROVIDER points at:
#
#     pip install -e ".[agents,openai]"
#
# The agent treats them identically — they differ only in which package supplies
# the LangChain integration, which is the whole point of src/sibyl/agents/llm.py.
# For open weights: [ollama] runs them locally, and [openai] also covers every
# server that speaks an OpenAI-shaped /v1 endpoint (vLLM, llama.cpp, LM Studio,
# TGI, OpenRouter, Together) via provider 'openai_compatible'.
anthropic = ["langchain-anthropic>=1.0,<2"]
openai    = ["langchain-openai>=1.0,<2"]
google    = ["langchain-google-genai>=4.0,<5"]
mistral   = ["langchain-mistralai>=1.0,<2"]
groq      = ["langchain-groq>=1.0,<2"]
ollama    = ["langchain-ollama>=1.0,<2"]

# Semantic retrieval over past forecasts. Installing this is the whole switch:
# the worker indexes finished jobs when it can import an embedding model, and
# skips silently when it cannot, so there is no flag to also get right.
#
# faiss-cpu used to be listed here and is gone. Nothing imported it, and nothing
# needs to: a flat index over a few thousand past forecasts is one matmul plus a
# partial sort, which is exactly what src/sibyl/vectorsearch/search.py does in
# numpy. FAISS is for trading exactness for speed at a scale this is nowhere
# near, and a compiled dependency nobody imports is the pattern that already cost
# this project twice — see mapie and asyncpg.
#
# torch stays: sentence-transformers pulls it in regardless, and pinning a
# transitive dependency that large is worth the line.
vectorsearch = [
    "sentence-transformers>=3.0,<6",
    "torch>=2.2,<3",
]

# The Celery worker that runs forecast jobs.
workers = [
    "celery[redis]>=5.3,<6",
    "redis>=5.0,<7",
]

# Persistence: the jobs table behind /forecast.
#
# psycopg rather than asyncpg, which is what this extra used to carry. asyncpg
# has no sync interface at all, so it could never have backed the sync engine the
# Celery worker needs — it was a driver chosen for an async design that was never
# built. psycopg 3 does both, so an async read path later needs no swap.
db = [
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
]

viz = [
    "plotly>=5.20,<7",
    "matplotlib>=3.8,<4",
]

# Experiment tracking and billing — not yet wired up.
ops = [
    "wandb>=0.17,<1",
    "stripe>=9.0,<15",
]

dev = [
    "pytest>=8.0,<10",
    "pytest-asyncio>=0.23,<2",
    "httpx>=0.27,<1",   # required by fastapi.testclient.TestClient
    "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
