# Alembic configuration. The database URL deliberately lives in env.py, read from
# DATABASE_URL, so there is exactly one place that decides which database anything
# talks to — a URL here would silently disagree with the app's the moment either moved.
[alembic]
script_location = alembic
prepend_sys_path = src
# Explicit, because the legacy default splits paths on spaces and colons as well
# as commas, and warns about it.
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
